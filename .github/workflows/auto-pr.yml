name: Auto-create PR for scheduling-branch

on:
  push:
    branches: [scheduling-branch]

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:scheduling-branch`,
              base: 'main'
            });
            if (prs.length === 0) {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'feat: add dental listing pages via scheduled job',
                body: 'Automated nightly job — dental listing pages generated by the scheduled runner.\n\nReview each suburb page before merging into main.',
                head: 'scheduling-branch',
                base: 'main'
              });
              console.log(`PR created: #${pr.number} — ${pr.html_url}`);
            } else {
              console.log(`PR #${prs[0].number} already open — skipping.`);
            }
