name: Auto-create PR for scheduling-branch

on:
  push:
    branches: [scheduling-branch]

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:scheduling-branch`,
              base: 'main'
            });
            if (prs.length === 0) {
              try {
                const { data: pr } = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'feat: add dental listing pages via scheduled job',
                  body: 'Automated nightly job — dental listing pages generated by the scheduled runner.\n\nReview each suburb page before merging into main.',
                  head: 'scheduling-branch',
                  base: 'main'
                });
                console.log(`PR created: #${pr.number} — ${pr.html_url}`);
              } catch (err) {
                // The repository setting "Allow GitHub Actions to create and approve pull
                // requests" is off, so GITHUB_TOKEN cannot open PRs. The nightly local job
                // (australia-dental-nightly) opens the PR itself with the owner's gh login,
                // so treat this as a warning instead of failing the run.
                if (err.status === 403) {
                  core.warning('GitHub Actions may not create pull requests in this repository; the nightly job opens the PR with gh instead.');
                } else {
                  throw err;
                }
              }
            } else {
              console.log(`PR #${prs[0].number} already open — skipping.`);
            }
