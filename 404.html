<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 — Page Not Found | Australia.md</title>
  <meta name="description" content="The page you requested could not be found in the Australia.md sovereign archive. Return home or browse the knowledge directory." />
  <link rel="canonical" href="https://australia.md/404.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --clr-surface: #0a160f;
      --clr-surface-container: #16221b;
      --clr-primary: #71dc8a;
      --clr-secondary-container: #fecc00;
      --clr-on-surface: #d8e6da;
      --clr-on-surface-variant: #bdcabb;
      --clr-outline-variant: #3e4a3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--clr-surface);
      color: var(--clr-on-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-image: radial-gradient(circle at 50% 0%, rgba(113, 220, 138, 0.10), transparent 60%);
    }
    main { max-width: 38rem; }
    .code {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--clr-primary);
      text-shadow: 0 0 40px rgba(113, 220, 138, 0.25);
    }
    .dot { color: var(--clr-secondary-container); }
    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      margin: 1rem 0 0.75rem;
    }
    p {
      color: var(--clr-on-surface-variant);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a.btn {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border-radius: 0.6rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a.btn:hover { transform: translateY(-2px); }
    a.primary { background: var(--clr-primary); color: #003916; }
    a.ghost {
      background: var(--clr-surface-container);
      color: var(--clr-on-surface);
      border: 1px solid var(--clr-outline-variant);
    }
    nav.links {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--clr-outline-variant);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.5rem;
      justify-content: center;
    }
    nav.links a {
      color: var(--clr-on-surface-variant);
      text-decoration: none;
      font-size: 0.9rem;
    }
    nav.links a:hover { color: var(--clr-primary); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>This record isn't in the archive</h1>
    <p>The page you requested could not be found. It may have moved, been renamed, or never existed. The archive endures — let's get you back to it.</p>
    <div class="actions">
      <a class="btn primary" href="/">Return home</a>
      <a class="btn ghost" href="/medical/dental/">Dental directory</a>
    </div>
    <nav class="links" aria-label="Popular sections">
      <a href="/medical/">Medical</a>
      <a href="/government/">Government</a>
      <a href="/history/">History</a>
      <a href="/geography/">Geography</a>
      <a href="/indigenous/">Indigenous</a>
      <a href="/submit/">Contribute</a>
    </nav>
  </main>
</body>
</html>
